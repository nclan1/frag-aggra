services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fragrance_database
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-frag}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-your_secure_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      args:
        CMD: api
    container_name: frag-api
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/fragrance_database
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-frag}:${RABBITMQ_PASSWORD:-your_secure_password}@rabbitmq:5672/
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        CMD: worker
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/fragrance_database
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-frag}:${RABBITMQ_PASSWORD:-your_secure_password}@rabbitmq:5672/
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    build:
      context: .
      args:
        CMD: scraper
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-frag}:${RABBITMQ_PASSWORD:-your_secure_password}@rabbitmq:5672/
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      REDDIT_USERNAME: ${REDDIT_USERNAME}
      REDDIT_PASSWORD: ${REDDIT_PASSWORD}
      REDDIT_FETCH_LIMIT: ${REDDIT_FETCH_LIMIT:-25}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: frag-frontend
    ports:
      - "80:80" # Main entry point — visit http://localhost
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  rabbitmq_data:
